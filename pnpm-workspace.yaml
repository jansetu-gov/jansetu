packages:
  - packages/*
publicHoistPattern:
  - "@babel/*"
  - "@expo/config-plugins"
catalog:
  react: 19.2.0
  react-dom: 19.2.0
  react-native: 0.83.2
  react-native-reanimated: 4.2.1
  react-native-web: ~0.21.0
  react-native-css-interop: 0.2.6
  nativewind: ^4.2.3
  expo: 55.0.6
  expo-video: 55.0.5
  expo-blur: ~55.0.9
  expo-image: ~55.0.6
  expo-linear-gradient: ~55.0.17
  expo-calendar: ~55.0.7
  expo-media-library: ~55.0.15
  expo-notifications: ~55.0.12
  expo-image-picker: ~55.0.19
  expo-camera: ~55.0.18
  expo-file-system: ~55.0.17
  expo-contacts: ~55.0.14
  expo-haptics: ~55.0.14
  expo-audio: 55.0.6
  expo-router: 55.0.5
  "@expo/metro-runtime": 55.0.11
  babel-preset-expo: 55.0.6
  "@sentry/react-native": 8.9.2
  oxlint: ^1.60.0
  typescript: ~5.9.2
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - miaoda-expo-devkit
  - '@expo/image-utils@0.8.17'
  - '@expo/require-utils@55.0.8'
  - expo-location@55.1.14
  - '@expo/cli@55.0.36'
  - '@expo/config@55.0.21'
  - '@expo/local-build-cache-provider@55.0.16'
  - '@expo/metro-config@55.0.27'
  - '@expo/prebuild-config@55.0.22'
  - babel-preset-expo@55.0.25
  - expo-asset@55.0.20
  - expo-file-system@55.0.26
  - expo-modules-autolinking@55.0.27
  - expo@55.0.30
  - expo-linear-gradient@55.0.18
  - expo-speech@55.0.18
  - expo-sqlite@55.0.20
  - expo-system-ui@55.0.22
allowUnusedPatches: true
packageExtensions:
  react-native-gifted-charts:
    dependencies:
      expo-linear-gradient: ~55.0.8
  react-native-css-interop:
    dependencies:
      connect: ^3.7.0
overrides:
  expo-audio: 55.0.6
  expo-video: 55.0.5
  metro-core: 0.83.7
allowBuilds:
  '@sentry/cli': true
  "@shopify/react-native-skia": true
  better-sqlite3: true
  esbuild: true
lockfileIncludeTarballUrl: false
onlyBuiltDependencies:
  - "@shopify/react-native-skia"
  - better-sqlite3
  - esbuild
